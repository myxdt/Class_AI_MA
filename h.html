<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혜택온 | 편의점 구독 서비스</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1931;
            --accent: #00d4ff;
            --bg-light: #f8f9fa;
            --text-dark: #333;
            --text-gray: #666;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; color: var(--text-dark); background-color: var(--bg-light); line-height: 1.6; }
        
        /* 공통 버튼 스타일 */
        .btn-primary {
            display: inline-block;
            padding: 16px 40px;
            background-color: var(--accent);
            color: var(--navy);
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn-primary:active { transform: scale(0.95); }

        /* 1. 상단 소개 (Hero) */
        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 20px; }
        header p { font-size: 1.1rem; opacity: 0.8; }

        /* 섹션 공통 */
        section { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 1.8rem; margin-bottom: 40px; color: var(--navy); }

        /* 2. 특징 3칸 (Features) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .feature-card {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .feature-card h3 { margin-bottom: 15px; color: var(--navy); }

        /* 3. 요금표 (Pricing) */
        .pricing-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .pricing-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .pricing-card.recommended {
            border-color: var(--accent);
            transform: scale(1.05);
            position: relative;
        }
        .recommended-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--navy);
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .price { font-size: 2.5rem; font-weight: 700; margin: 20px 0; }

        /* 4. FAQ (Accordion) */
        .faq-container { max-width: 700px; margin: 0 auto; }
        .faq-item {
            background: var(--white);
            margin-bottom: 10px;
            border-radius: 10px;
            overflow: hidden;
        }
        .faq-question {
            padding: 20px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
        }
        .faq-answer {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: var(--text-gray);
            font-size: 0.95rem;
        }
        .faq-item.active .faq-answer { max-height: 200px; padding-bottom: 20px; }

        /* 5. 하단 신청 버튼 영역 */
        .cta-section {
            text-align: center;
            padding: 80px 20px;
            background-color: var(--white);
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .pricing-card.recommended { transform: none; }
            .features-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 1. 상단 소개 -->
    <header>
        <!-- [원고 내용 삽입: 메인 타이틀] -->
        <h1>혜택온</h1>
        <!-- [원고 내용 삽입: 서브 타이틀/설명] -->
        <p>편의점을 더 스마트하게 이용하는 방법</p>
    </header>

    <!-- 2. 특징 3칸 -->
    <section>
        <h2 class="section-title">서비스 특징</h2>
        <div class="features-grid">
            <div class="feature-card">
                <!-- [원고 내용 삽입: 특징 1 제목] -->
                <h3>특징 1</h3>
                <!-- [원고 내용 삽입: 특징 1 설명] -->
                <p>내용을 입력해주세요.</p>
            </div>
            <div class="feature-card">
                <!-- [원고 내용 삽입: 특징 2 제목] -->
                <h3>특징 2</h3>
                <!-- [원고 내용 삽입: 특징 2 설명] -->
                <p>내용을 입력해주세요.</p>
            </div>
            <div class="feature-card">
                <!-- [원고 내용 삽입: 특징 3 제목] -->
                <h3>특징 3</h3>
                <!-- [원고 내용 삽입: 특징 3 설명] -->
                <p>내용을 입력해주세요.</p>
            </div>
        </div>
    </section>

    <!-- 3. 요금표 -->
    <section style="background-color: #f1f3f5;">
        <h2 class="section-title">요금 안내</h2>
        <div class="pricing-container">
            <!-- 일반 플랜 -->
            <div class="pricing-card">
                <h3>베이직 플랜</h3>
                <div class="price">₩0</div>
                <p>기본 혜택 제공</p>
            </div>
            <!-- 추천 플랜 -->
            <div class="pricing-card recommended">
                <div class="recommended-badge">가장 인기 있는 플랜</div>
                <h3>프리미엄 플랜</h3>
                <div class="price">₩4,900</div>
                <p>모든 혜택 무제한 이용</p>
            </div>
        </div>
    </section>

    <!-- 4. FAQ -->
    <section>
        <h2 class="section-title">자주 묻는 질문</h2>
        <div class="faq-container">
            <!-- [원고 내용 삽입: 질문 1] -->
            <div class="faq-item">
                <button class="faq-question" onclick="toggleFaq(this)">
                    질문 1이 무엇인가요? <span>+</span>
                </button>
                <div class="faq-answer">
                    질문 1에 대한 답변 내용을 여기에 입력하세요.
                </div>
            </div>
            <!-- [원고 내용 삽입: 질문 2] -->
            <div class="faq-item">
                <button class="faq-question" onclick="toggleFaq(this)">
                    질문 2가 궁금해요! <span>+</span>
                </button>
                <div class="faq-answer">
                    질문 2에 대한 답변 내용을 여기에 입력하세요.
                </div>
            </div>
        </div>
    </section>

    <!-- 5. 신청 버튼 -->
    <div class="cta-section">
        <!-- [원고 내용 삽입: 버튼 문구] -->
        <button class="btn-primary" onclick="showDemoAlert()">무료 체험 시작하기</button>
    </div>

    <script>
        // FAQ 아코디언 기능
        function toggleFaq(element) {
            const item = element.parentElement;
            const isOpen = item.classList.contains('active');
            
            // 모든 FAQ 닫기 (선택 사항)
            document.querySelectorAll('.faq-item').forEach(el => el.classList.remove('active'));
            
            // 클릭한 요소 토글
            if (!isOpen) {
                item.classList.add('active');
            }
        }

        // 버튼 클릭 시 데모 안내 알림
        function showDemoAlert() {
            alert("신청 접수(데모) 안내\n\n현재는 데모 버전입니다.\n실제 서비스 신청 단계로 연결됩니다.");
        }
    </script>
</body>
</html>
